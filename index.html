<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kanban</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app">
      <header class="header">
        <div>
          <span class="eyebrow">WORKSPACE</span>
          <h1>Kanban</h1>
          <p>Organize your work, one task at a time.</p>
        </div>

        <button class="add-task-btn" id="openModalBtn">
          <span>+</span>
          New Task
        </button>
      </header>

      <main class="board">
        <section class="column">
          <div class="column-header">
            <div>
              <h2>To Do</h2>
              <span class="task-count" id="todoCount">0 tasks</span>
            </div>

            <span class="column-number">01</span>
          </div>

          <div class="task-list" id="todoList"></div>
        </section>

        <section class="column">
          <div class="column-header">
            <div>
              <h2>In Progress</h2>
              <span class="task-count" id="progressCount">0 tasks</span>
            </div>

            <span class="column-number">02</span>
          </div>

          <div class="task-list" id="progressList"></div>
        </section>

        <section class="column">
          <div class="column-header">
            <div>
              <h2>Done</h2>
              <span class="task-count" id="doneCount">0 tasks</span>
            </div>

            <span class="column-number">03</span>
          </div>

          <div class="task-list" id="doneList"></div>
        </section>
      </main>
    </div>

    <div class="modal-overlay" id="modalOverlay">
      <div class="modal">
        <div class="modal-header">
          <div>
            <span class="eyebrow">TASK DETAILS</span>
            <h2 id="modalTitle">Create New Task</h2>
          </div>

          <button class="close-btn" id="closeModalBtn">&times;</button>
        </div>

        <form id="taskForm">
          <div class="form-group">
            <label for="taskTitle">Task Title</label>
            <input
              type="text"
              id="taskTitle"
              placeholder="What needs to be done?"
              maxlength="100"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="taskPriority">Priority</label>

              <select id="taskPriority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>

            <div class="form-group">
              <label for="taskDate">Due Date</label>

              <input type="date" id="taskDate" />
            </div>
          </div>

          <div class="form-group">
            <label for="taskDescription">Description</label>

            <textarea
              id="taskDescription"
              placeholder="Add a short description..."
              maxlength="500"
              rows="5"
            ></textarea>

            <span class="character-count">
              <span id="characterCount">0</span>/500
            </span>
          </div>

          <div class="form-actions">
            <button type="button" class="cancel-btn" id="cancelBtn">
              Cancel
            </button>

            <button type="submit" class="save-btn">
              <span id="submitText">Create Task</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
